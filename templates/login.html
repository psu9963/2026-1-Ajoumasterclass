<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 당신만을 위한 A+ 스터디 플래너</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page-body">
    <div class="login-container fade-in-up">
        <h2 class="login-title">로그인</h2>
        <p class="login-subtitle">에스플에 오신 것을 환영합니다.</p>
        
        <!-- 🌟 회원가입 성공 시 파란색 메시지 출력 🌟 -->
        {% if success %}
            <div style="color: #3498db; font-size: 13px; margin-bottom: 15px; font-weight: bold;">
                {{ success }}
            </div>
        {% endif %}

        <!-- 🌟 아이디/비번 틀렸을 때 빨간색 메시지 출력 🌟 -->
        {% if error %}
            <div style="color: red; font-size: 13px; margin-bottom: 15px; font-weight: bold;">
                {{ error }}
            </div>
        {% endif %}
        
        <form action="/login" method="POST">
            <div class="input-group">
                <label for="userid">아이디</label>
                <input type="text" id="userid" name="userid" placeholder="아이디를 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="btn-submit">로그인 하기</button>
        </form>
<!-- 버튼들을 가운데 정렬하고 여백을 주는 컨테이너 -->
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px;">

    <!-- 🟡 카카오 로그인 공식 디자인 스타일 -->
    <a href="{{ url_for('login.kakao_login') }}" 
       style="display: flex; align-items: center; justify-content: center; width: 300px; height: 45px; background-color: #FEE500; color: #000000; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: bold;">
        <!-- 카카오 말풍선 로고 -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" 
             style="width: 20px; margin-right: 10px;" alt="카카오 로고">
        카카오계정으로   로그인
    </a>

    <!-- ⚪ 구글 로그인 공식 디자인 스타일 -->
    <a href="{{ url_for('login.google_login') }}" 
       style="display: flex; align-items: center; justify-content: center; width: 300px; height: 45px; background-color: #FFFFFF; color: #3C4043; text-decoration: none; border: 1px solid #DADCE0; border-radius: 6px; font-size: 14px; font-weight: 500; font-family: 'Roboto', sans-serif;">
        <!-- 구글 G 로고 -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" 
             style="width: 18px; margin-right: 10px;" alt="구글 로고">
        구글 계정으로 로그인
    </a>

</div>

        <!-- 기존 카카오 버튼 아래에 추가 -->


        
        <div class="register-link">
            계정이 없으신가요? <a href="/register">회원가입 하기</a>
        </div>
        
        <a href="/" class="back-link">메인으로 돌아가기</a>
    </div>
</body>
</html>
